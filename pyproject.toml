[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mr-led-getter"
version = "1.0.0"
description = "Meshroom plugin for LED-getter self-calibrated near-light photometric stereo"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Benjamin Coupry"}]
requires-python = ">=3.11"
dependencies = [
    # Meshroom runtime dependency of the compute processes
    "psutil",
    # common photometric stereo layer (psCommon.py) and nodes
    "numpy",
    "opencv-python-headless",
    # LED-getter library, pinned to a commit (it requires plain "jax", i.e. CPU only, and sphericart-jax==1.0.8)
    "ledgetter @ git+https://github.com/BenjaminCoupry/LED-getter.git@4d4febec3ac100cc48cba27875ebaba202f6c100",
    # GPU JAX: sphericart-jax 1.0.8 requires jax>=0.6.0,<0.9.1; 0.9.0.1 is the latest release in that range
    # (Python >= 3.11, CUDA 12 wheels)
    "jax[cuda12]==0.9.0.1",
    "optax",
]

# Meshroom discovers the nodes from MESHROOM_PLUGINS_PATH, not site-packages.
# This distribution installs the plugin's dependencies into its venv.
[tool.setuptools]
packages = []
